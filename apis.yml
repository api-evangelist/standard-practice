aid: standard-practice
name: Standard Practice
description: Standard Practice builds voice AI for healthcare revenue cycle management
  (RCM) teams. Its AI agents place and handle outbound phone calls to insurance payers
  to automate administrative work — claim status follow-up, benefits verification,
  prior authorization, and EDI enrollment — so billing teams can scale collections
  and get paid more, faster. The platform is delivered as a private, login-gated web
  application. The company was surfaced through the API Evangelist network as a portfolio
  company of Bloomberg Beta and Wing Venture Capital and enriched by the pipeline.
